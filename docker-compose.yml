
services:
  db:
    image: "postgres:17"
    container_name: spec_shop_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: shop_user
      POSTGRES_PASSWORD: shop_password
      POSTGRES_DB: shop_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_user -d spec_shop"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
