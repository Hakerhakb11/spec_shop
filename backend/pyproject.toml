[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Hakerhakb11",email = "igorshilov2007@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "sqlalchemy (>=2.0.54,<3.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "email-validator (>=2.3.0,<3.0.0)"
]

[tool.poetry]
name = "backend"
version = "0.1.0"
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "ruff (>=0.16.10,<0.17.0)",
    "pre-commit (>=4.6.2,<5.0.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
per-file-ignores = { "**/conftest.py" = ["E402"] }