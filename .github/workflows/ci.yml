name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_shop_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_shop_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_shop_user -d test_shop_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install poetry
          cd backend
          poetry install

      - name: Lint and format
        run: |
          cd backend
          poetry run ruff check .
          poetry run ruff format --check .
          
      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+psycopg://test_shop_user:test_password@localhost:5432/test_shop_db
        run: |
          cd backend
          poetry run pytest -v